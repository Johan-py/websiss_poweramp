version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: websiss-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-websiss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-websiss_secret}
      POSTGRES_DB: ${POSTGRES_DB:-websiss_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-websiss} -d ${POSTGRES_DB:-websiss_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
